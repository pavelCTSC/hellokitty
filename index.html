<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty Kawaii</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff5f8;
    --bg2: #ffe3ec;
    --pink: #ff6fa3;
    --pink-dark: #e04883;
    --text: #4a2a3a;
    --muted: #8a6576;
    --card: #ffffff;
    --face: #ffffff;
    --line: #3a2430;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a1822; --bg2: #3a2230; --text: #ffe9f1; --muted: #d9b3c4; --card: #3d2633;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Baloo 2", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% 10%, var(--bg2), var(--bg) 60%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  header { text-align: center; }
  h1 {
    font-size: clamp(2.6rem, 8vw, 4.5rem);
    margin: 8px 0 0;
    color: var(--pink);
    letter-spacing: -1px;
    text-shadow: 3px 3px 0 #ffd0e0;
  }
  .tag { color: var(--muted); font-size: 1.2rem; margin: 0 0 16px; }

  .kitty { width: min(320px, 80vw); cursor: pointer; transition: transform .3s; display: block; margin: 0 auto; }
  .kitty:hover { transform: rotate(-4deg) scale(1.03); }
  .kitty .eye { transform-origin: center; transform-box: fill-box; animation: blink 4s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .bubble {
    display: inline-block; background: var(--card); padding: 10px 18px; border-radius: 20px;
    box-shadow: 0 4px 0 #ffc2d6; font-weight: 700; min-height: 1.5em; margin-top: 4px;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: 48px; }
  .card {
    background: var(--card); border-radius: 24px; padding: 22px; text-align: center;
    box-shadow: 0 6px 0 #ffc2d6; transition: transform .2s;
  }
  .card:hover { transform: translateY(-4px); }
  .card .ico { font-size: 2.6rem; }
  .card h3 { margin: 6px 0 4px; color: var(--pink-dark); font-size: 1.35rem; }
  .card p { margin: 0; color: var(--muted); }

  .btn {
    margin-top: 36px; background: var(--pink); color: #fff; border: 0; border-radius: 999px;
    padding: 14px 30px; font: 800 1.2rem "Baloo 2", sans-serif; cursor: pointer;
    box-shadow: 0 5px 0 var(--pink-dark); transition: transform .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-dark); }
  .center { text-align: center; }
  footer { text-align: center; color: var(--muted); margin-top: 48px; font-size: .95rem; }

  .heart {
    position: fixed; top: -40px; pointer-events: none; font-size: 24px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .2; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kitty Kawaii</h1>
    <p class="tag">Nejroztomilejší kočička na internetu 🎀</p>

    <svg class="kitty" id="kitty" viewBox="0 0 300 260" role="img" aria-label="Roztomilá kreslená kočička">
      <!-- ears -->
      <path d="M58 95 L70 22 L128 62 Z" fill="var(--face)" stroke="var(--line)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M242 95 L230 22 L172 62 Z" fill="var(--face)" stroke="var(--line)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M75 70 L80 40 L108 60 Z" fill="#ffb3cc"/>
      <path d="M225 70 L220 40 L192 60 Z" fill="#ffb3cc"/>
      <!-- head -->
      <ellipse cx="150" cy="140" rx="118" ry="92" fill="var(--face)" stroke="var(--line)" stroke-width="6"/>
      <!-- flower crown -->
      <g>
        <circle cx="105" cy="58" r="13" fill="#ffd166"/><circle cx="105" cy="58" r="5" fill="#ff8fab"/>
        <circle cx="150" cy="50" r="15" fill="#ff8fab"/><circle cx="150" cy="50" r="6" fill="#ffd166"/>
        <circle cx="195" cy="58" r="13" fill="#9bf6ff"/><circle cx="195" cy="58" r="5" fill="#ff8fab"/>
      </g>
      <!-- eyes -->
      <ellipse class="eye" cx="105" cy="140" rx="11" ry="15" fill="var(--line)"/>
      <ellipse class="eye" cx="195" cy="140" rx="11" ry="15" fill="var(--line)"/>
      <circle cx="109" cy="134" r="4" fill="#fff"/><circle cx="199" cy="134" r="4" fill="#fff"/>
      <!-- cheeks -->
      <ellipse cx="80" cy="172" rx="16" ry="9" fill="#ffb3cc" opacity=".8"/>
      <ellipse cx="220" cy="172" rx="16" ry="9" fill="#ffb3cc" opacity=".8"/>
      <!-- nose + smile -->
      <path d="M143 160 h14 l-7 8 z" fill="#ff6fa3"/>
      <path d="M150 168 q-10 14 -20 4 M150 168 q10 14 20 4" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <!-- whiskers -->
      <g stroke="var(--line)" stroke-width="4" stroke-linecap="round">
        <line x1="20" y1="148" x2="62" y2="155"/><line x1="18" y1="172" x2="60" y2="170"/>
        <line x1="280" y1="148" x2="238" y2="155"/><line x1="282" y1="172" x2="240" y2="170"/>
      </g>
    </svg>
    <div class="bubble" id="bubble">Klikni na mě! 🐾</div>
  </header>

  <section class="grid">
    <div class="card"><div class="ico">🍓</div><h3>Jahody</h3><p>Oblíbená svačinka. Vždycky dvě, nikdy jedna.</p></div>
    <div class="card"><div class="ico">🧶</div><h3>Klubíčko</h3><p>Nejlepší hračka na světě. Nebo krabice.</p></div>
    <div class="card"><div class="ico">🌸</div><h3>Kytičky</h3><p>Nosí věneček každý den, i v pondělí.</p></div>
    <div class="card"><div class="ico">💤</div><h3>Spánek</h3><p>16 hodin denně. Profesionálka.</p></div>
  </section>

  <div class="center">
    <button class="btn" id="love">Pošli kočičce lásku 💖</button>
  </div>

  <footer>Vyrobeno s 💕 a Claudem</footer>
</div>

<script>
  const lines = ["Mňau! 😺", "Máš jahodu? 🍓", "Pohlaď mě 🥰", "Purrrr… 💤", "Jsi super! ✨", "Mňaaau 🎀"];
  const bubble = document.getElementById("bubble");
  document.getElementById("kitty").addEventListener("click", () => {
    bubble.textContent = lines[Math.floor(Math.random() * lines.length)];
  });

  const emojis = ["💖", "🎀", "🌸", "✨", "🍓", "💕"];
  document.getElementById("love").addEventListener("click", () => {
    for (let i = 0; i < 30; i++) {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = 2 + Math.random() * 3 + "s";
      h.style.animationDelay = Math.random() * 0.8 + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 6000);
    }
    bubble.textContent = "Děkuju! 💖";
  });
</script>
</body>
</html>
